[package]
name = "dbnget"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "Command-line downloader for Databento historical market data"
license = "MIT"
repository = "https://github.com/folknor/dbnget"
readme = "README.md"
keywords = ["databento", "market-data", "trading", "finance", "dbn"]
categories = ["command-line-utilities", "finance"]
exclude = [
    # Never publishable, whatever else changes here.
    "/scratch",
    "/.reference",
    "databento.key",
    "*.key",
    # Agent and tooling configuration. Meaningless outside this checkout, and
    # `brokkr` and `review` are not tools a consumer of the crate has.
    "/AGENTS.md",
    "/CLAUDE.md",
    "/brokkr.toml",
    "/.review.toml",
    "/.gitignore",
    # Development probe: needs an API key on disk and a network round trip, so it
    # cannot run for anyone installing this from crates.io.
    "/examples",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
databento = "0.58"
# Cross-platform advisory file locking. The lock has to be released by the operating
# system when the process dies, because a download is exactly the thing that gets
# interrupted - anything we would have to clean up ourselves goes stale on the one path
# where staleness is guaranteed to happen.
fs4 = "1.1"
sha2 = "0.10"
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"
